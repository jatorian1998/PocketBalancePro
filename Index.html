<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pocket Balancer" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="HVAC field balancing tool for supply outlet air measurements" />

  <title>Pocket Balancer</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── TOKENS ───────────────────────────────────────────────── */
    :root {
      --bg:      #0d1018;
      --sf:      #161b27;
      --sf2:     #1f2638;
      --sf3:     #252d40;
      --bd:      #2c3550;
      --bd2:     #3a4560;
      --ac:      #00d4ff;
      --ac-dim:  rgba(0,212,255,0.12);
      --ac2:     #ff7040;
      --ac2-dim: rgba(255,112,64,0.12);
      --tx:      #edf0f7;
      --tx2:     #a8b0c8;
      --mu:      #5a6480;
      --go:      #27d46a;
      --go-dim:  rgba(39,212,106,0.15);
      --wa:      #f5a623;
      --ba:      #f04040;
      --hb:      #0d1018;
      --row-a:   #161b27;
      --row-b:   #121620;
    }

    /* ── RESET ────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: 'Barlow Condensed', sans-serif;
      min-height: 100%;
      padding-bottom: env(safe-area-inset-bottom, 70px);
      padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
      overscroll-behavior: none;
    }

    /* ── TOP BAR ──────────────────────────────────────────────── */
    .topbar {
      background: var(--hb);
      border-bottom: 2px solid var(--ac);
      padding: 14px 14px 12px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tr1 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ttl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--ac);
      letter-spacing: 3px;
      text-transform: uppercase;
      flex: 1;
    }

    .svpill {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--go);
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .svpill.show { opacity: 1; }

    .jbtn {
      background: var(--sf2);
      border: 1px solid var(--bd);
      color: var(--ac);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 1px;
      min-height: 36px;
    }

    .ur {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .ui {
      background: var(--sf2);
      border: 1px solid var(--bd);
      color: var(--tx);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 6px;
      flex: 1;
      letter-spacing: 1px;
      min-height: 46px;
    }
    .ui::placeholder { color: var(--mu); font-weight: 400; }
    .ui:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac-dim); }

    .badge {
      background: var(--ac);
      color: #000;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 4px;
      white-space: nowrap;
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    /* ── INFO BARS ────────────────────────────────────────────── */
    .ibar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--sf);
      border-bottom: 1px solid var(--bd);
      min-height: 52px;
    }

    .ibar label {
      font-size: 12px;
      font-weight: 700;
      color: var(--tx2);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ibar .hint {
      font-size: 10px;
      color: var(--mu);
      flex: 1;
      text-align: right;
    }

    .ival {
      font-family: 'Share Tech Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--ac2);
      min-width: 70px;
    }

    .akin {
      background: var(--sf2);
      border: 1px solid var(--bd);
      color: var(--ac2);
      font-family: 'Share Tech Mono', monospace;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 5px;
      width: 110px;
      text-align: center;
      min-height: 44px;
    }
    .akin::placeholder { color: var(--mu); }
    .akin:focus { outline: none; border-color: var(--ac2); box-shadow: 0 0 0 2px var(--ac2-dim); }

    /* ── PROGRESS ─────────────────────────────────────────────── */
    .pw {
      padding: 8px 14px 0;
      background: var(--sf);
      border-bottom: 1px solid var(--bd);
    }

    .pt {
      height: 4px;
      background: var(--bd);
      border-radius: 2px;
      overflow: hidden;
    }

    .pf {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--ac), var(--go));
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .pl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--tx2);
      text-align: right;
      margin-top: 4px;
      padding-bottom: 8px;
      letter-spacing: 1px;
    }

    /* ── TOTALS BAR ───────────────────────────────────────────── */
    .totbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--bd);
      border-bottom: 2px solid var(--bd2);
    }

    .tc {
      background: var(--sf);
      padding: 10px 4px;
      text-align: center;
    }

    .tc .tl {
      font-size: 9px;
      font-weight: 700;
      color: var(--mu);
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
    }

    .tc .tv {
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      color: var(--ac);
      font-weight: 700;
    }

    .tc .tv.accent2 { color: var(--ac2); }

    /* ── COLUMN HEADERS ───────────────────────────────────────── */
    .chead {
      display: grid;
      grid-template-columns: 46px 1fr 1fr 1fr 1fr 1fr;
      gap: 1px;
      background: var(--bd);
      position: sticky;
      top: 88px;
      z-index: 90;
    }

    .ch {
      background: #1a2035;
      padding: 9px 2px 7px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--tx2);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .ch sub {
      display: block;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      color: var(--mu);
      margin-top: 2px;
      font-style: normal;
    }

    .ch.lbl { background: var(--hb); }
    .ch.akc { background: var(--ac2-dim); color: var(--ac2); }

    /* ── OUTLET LIST ──────────────────────────────────────────── */
    .olist {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--bd);
    }

    .orow {
      display: grid;
      grid-template-columns: 46px 1fr 1fr 1fr 1fr 1fr;
      gap: 1px;
      background: var(--bd);
    }

    .orow:nth-child(even) .oc { background: var(--row-a); }
    .orow:nth-child(odd)  .oc { background: var(--row-b); }

    .olbl {
      background: var(--hb) !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;
      gap: 3px;
      border-right: 2px solid var(--bd);
      border-left: 3px solid transparent;
      transition: border-left-color 0.2s;
    }

    .onum {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--ac);
    }

    .otag {
      font-size: 7px;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── CELLS ────────────────────────────────────────────────── */
    .oc { padding: 0; }

    .oc input {
      width: 100%;
      height: 100%;
      min-height: 60px;
      background: transparent;
      border: none;
      color: var(--tx);
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      text-align: center;
      padding: 4px 2px;
      display: block;
      -webkit-appearance: none;
      appearance: none;
    }

    .oc input:focus {
      outline: none;
      background: var(--ac-dim);
      color: #fff;
    }

    .oc input::placeholder {
      color: var(--bd2);
      font-size: 20px;
    }

    /* Design CFM — blue tint */
    .oc.des input { color: #b0beff; }

    /* CFM Calc — cyan, clearly readable */
    .oc.cfm { background: var(--ac-dim) !important; }
    .oc.cfm input {
      color: var(--ac);
      font-size: 15px;
      font-weight: 700;
    }

    /* Prelim — green when filled */
    .oc.pre input:not(:placeholder-shown) { color: #7fffc0; }

    /* Prelim % cell */
    .oc.ppc { background: var(--ac2-dim) !important; }

    /* True CFM (AK) cell */
    .oc.akcol { background: rgba(255,112,64,0.08) !important; }

    /* ── DISPLAY CELLS (non-input) ────────────────────────────── */
    .ppv {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      font-weight: 700;
    }

    .ppv.e { color: var(--bd2); }
    .ppv.g { color: var(--go); }
    .ppv.m { color: var(--wa); }
    .ppv.b { color: var(--ba); }

    .akv {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--ac2);
    }

    .akv.e { color: var(--bd2); }

    /* ── ROW STATUS STRIPE ────────────────────────────────────── */
    .orow.complete .olbl { border-left-color: var(--go); }
    .orow.partial  .olbl { border-left-color: var(--wa); }

    /* ── ACTION BAR ───────────────────────────────────────────── */
    .actbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--hb);
      border-top: 2px solid var(--bd2);
      display: flex;
      gap: 1px;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .ab {
      flex: 1;
      padding: 16px 4px;
      background: var(--sf);
      border: none;
      color: var(--tx2);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .ab:active { background: var(--sf3); color: var(--tx); }
    .ab.pri { color: var(--ac); }
    .ab.dan { color: var(--ba); }

    /* ── JOBS OVERLAY ─────────────────────────────────────────── */
    .ov {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 400;
      align-items: flex-end;
    }

    .ov.open { display: flex; }

    .dr {
      background: var(--sf);
      width: 100%;
      border-radius: 18px 18px 0 0;
      border-top: 2px solid var(--ac);
      max-height: 80vh;
      overflow-y: auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .dh {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px;
      border-bottom: 1px solid var(--bd);
      position: sticky;
      top: 0;
      background: var(--sf);
      z-index: 1;
    }

    .dh h2 {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--ac);
      letter-spacing: 2px;
    }

    .dc {
      background: none;
      border: none;
      color: var(--tx2);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .jr {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--bd);
      gap: 12px;
      cursor: pointer;
      min-height: 64px;
    }

    .jr:active { background: var(--sf2); }

    .ji { flex: 1; min-width: 0; }

    .jn {
      font-size: 17px;
      font-weight: 700;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jm {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--tx2);
      margin-top: 4px;
    }

    .jab {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      background: var(--ac);
      color: #000;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      font-weight: 700;
    }

    .jdl {
      background: none;
      border: none;
      color: var(--ba);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .njb {
      display: block;
      margin: 16px;
      width: calc(100% - 32px);
      padding: 16px;
      background: transparent;
      border: 1px dashed var(--bd2);
      color: var(--ac);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      min-height: 56px;
    }

    .nojobs {
      padding: 32px 16px;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--mu);
      line-height: 2;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="tr1">
      <span class="ttl">▸ Pocket Balancer</span>
      <span class="svpill" id="svpill">SAVED ✓</span>
      <button class="jbtn" onclick="openJobs()">JOBS ☰</button>
    </div>
    <div class="ur">
      <input class="ui" id="uname" placeholder="Unit ID — e.g. RTU-01" maxlength="40" autocomplete="off" oninput="autoSave()" />
      <div class="badge" id="sbadge">0/20</div>
    </div>
  </div>

  <!-- TARGET % -->
  <div class="ibar">
    <label>Target %</label>
    <span class="ival" id="tpct">—</span>
    <span class="hint">Prelim &divide; Design totals</span>
  </div>

  <!-- AK FACTOR -->
  <div class="ibar">
    <label>AK Factor</label>
    <input class="akin" id="akf" type="number" inputmode="decimal" step="0.001" min="0" placeholder="optional" autocomplete="off" oninput="refreshAll();autoSave()" />
    <span class="hint">Prelim &times; AK = True CFM</span>
  </div>

  <!-- PROGRESS -->
  <div class="pw">
    <div class="pt"><div class="pf" id="pf"></div></div>
    <div class="pl" id="pl">0 of 20 outlets complete</div>
  </div>

  <!-- TOTALS -->
  <div class="totbar">
    <div class="tc"><span class="tl">Design</span><span class="tv" id="tD">—</span></div>
    <div class="tc"><span class="tl">Tgt %</span><span class="tv accent2" id="tPt">—</span></div>
    <div class="tc"><span class="tl">CFM Calc</span><span class="tv" id="tC">—</span></div>
    <div class="tc"><span class="tl">Prelim</span><span class="tv" id="tPr">—</span></div>
  </div>

  <!-- COLUMN HEADERS -->
  <div class="chead">
    <div class="ch lbl">OTL</div>
    <div class="ch">Des<sub>CFM</sub></div>
    <div class="ch">CFM<sub>Calc</sub></div>
    <div class="ch">Prelim<sub>CFM</sub></div>
    <div class="ch">Pre<sub>%</sub></div>
    <div class="ch akc">True<sub>CFM</sub></div>
  </div>

  <!-- OUTLET ROWS -->
  <div class="olist" id="olist"></div>

  <!-- ACTION BAR -->
  <div class="actbar">
    <button class="ab dan" onclick="clearAll()">Clear</button>
    <button class="ab" onclick="addRow()">+ Row</button>
    <button class="ab pri" onclick="copyCSV()">Copy CSV</button>
  </div>

  <!-- JOBS OVERLAY -->
  <div class="ov" id="ov" onclick="bgClose(event)">
    <div class="dr">
      <div class="dh">
        <h2>SAVED JOBS</h2>
        <button class="dc" onclick="closeJobs()">&#x2715;</button>
      </div>
      <div id="jlist"></div>
      <button class="njb" onclick="newJob()">+ New Job / Unit</button>
    </div>
  </div>

<script>
  /* ── CONSTANTS ─────────────────────────────────────────────── */
  var DR = 20;
  var rc = DR;
  var cid = null;
  var stimer = null;

  /* ── STORAGE ───────────────────────────────────────────────── */
  function getJobs() {
    try { return JSON.parse(localStorage.getItem('pb_jobs') || '{}'); } catch(e) { return {}; }
  }
  function putJobs(j) { localStorage.setItem('pb_jobs', JSON.stringify(j)); }
  function getSavedId() { return localStorage.getItem('pb_cur') || null; }
  function setSavedId(id) { localStorage.setItem('pb_cur', id); cid = id; }

  /* ── DOM HELPERS ───────────────────────────────────────────── */
  function el(id) { return document.getElementById(id); }
  function v(id) { var e = el(id); return e ? e.value : ''; }
  function s(id, val) { var e = el(id); if (e) e.value = val; }
  function setText(id, txt) { var e = el(id); if (e) e.textContent = txt; }

  /* ── CAPTURE / RESTORE ─────────────────────────────────────── */
  function capture() {
    var outlets = [];
    for (var i = 1; i <= rc; i++) {
      outlets.push({ d: v('d' + i), p: v('p' + i) });
    }
    return { name: v('uname'), ak: v('akf'), rows: rc, outlets: outlets, ts: Date.now() };
  }

  function restore(st) {
    if (!st) return;
    rc = st.rows || DR;
    buildRows(rc);
    s('uname', st.name || '');
    s('akf', st.ak || '');
    var outlets = st.outlets || [];
    for (var i = 0; i < outlets.length; i++) {
      s('d' + (i + 1), outlets[i].d || '');
      s('p' + (i + 1), outlets[i].p || '');
    }
    refreshAll();
  }

  /* ── AUTO-SAVE ─────────────────────────────────────────────── */
  function autoSave() {
    if (!cid) { cid = 'j' + Date.now(); setSavedId(cid); }
    clearTimeout(stimer);
    stimer = setTimeout(function() {
      var jobs = getJobs();
      jobs[cid] = capture();
      putJobs(jobs);
      var pill = el('svpill');
      if (pill) {
        pill.classList.add('show');
        setTimeout(function() { pill.classList.remove('show'); }, 1800);
      }
    }, 500);
  }

  /* ── BUILD ROWS ────────────────────────────────────────────── */
  function buildRows(n) {
    var list = el('olist');
    if (!list) return;
    list.innerHTML = '';
    for (var i = 1; i <= n; i++) appendRow(i, list);
  }

  function appendRow(i, list) {
    if (!list) list = el('olist');
    var row = document.createElement('div');
    row.className = 'orow';
    row.id = 'row' + i;
    row.innerHTML =
      '<div class="olbl">' +
        '<span class="onum">' + String(i).padStart(2, '0') + '</span>' +
        '<span class="otag">OTL</span>' +
      '</div>' +
      '<div class="oc des">' +
        '<input type="number" inputmode="numeric" placeholder="—" id="d' + i + '" autocomplete="off" oninput="refreshAll();autoSave()">' +
      '</div>' +
      '<div class="oc cfm">' +
        '<input type="number" placeholder="—" id="c' + i + '" readonly tabindex="-1">' +
      '</div>' +
      '<div class="oc pre">' +
        '<input type="number" inputmode="numeric" placeholder="—" id="p' + i + '" autocomplete="off" oninput="refreshAll();autoSave()">' +
      '</div>' +
      '<div class="oc ppc">' +
        '<div class="ppv e" id="pv' + i + '">—</div>' +
      '</div>' +
      '<div class="oc akcol">' +
        '<div class="akv e" id="av' + i + '">—</div>' +
      '</div>';
    list.appendChild(row);
  }

  /* ── CALCULATIONS ──────────────────────────────────────────── */
  function getAK() { return parseFloat(v('akf')) || 0; }

  /* Target % = raw Prelim total / Design total — AK never involved */
  function calcTgtPct() {
    var tD = 0, tP = 0;
    for (var i = 1; i <= rc; i++) {
      tD += parseFloat(v('d' + i)) || 0;
      tP += parseFloat(v('p' + i)) || 0;
    }
    return (tD && tP) ? (tP / tD * 100) : 0;
  }

  function refreshAll() {
    var pct = calcTgtPct();
    var ak  = getAK();

    setText('tpct', pct ? pct.toFixed(1) + '%' : '—');

    var tD = 0, tC = 0, tP = 0;
    var hasD = false, hasP = false, done = 0;

    for (var i = 1; i <= rc; i++) {
      var d = parseFloat(v('d' + i)) || 0;
      var p = parseFloat(v('p' + i)) || 0;

      /* CFM Calc = Design x Target% — AK never touches this */
      var cfmEl = el('c' + i);
      if (cfmEl) cfmEl.value = (d && pct) ? (d * pct / 100).toFixed(1) : '';

      /* Prelim % = raw Prelim / Design — no AK */
      var pvEl = el('pv' + i);
      if (pvEl) {
        if (!d || !p) {
          pvEl.textContent = '—';
          pvEl.className = 'ppv e';
        } else {
          var pp = p / d * 100;
          pvEl.textContent = pp.toFixed(0) + '%';
          pvEl.className = 'ppv ' + (pp >= 90 && pp <= 110 ? 'g' : (pp >= 80 && pp <= 120 ? 'm' : 'b'));
        }
      }

      /* True CFM = Prelim x AK — only this column uses AK */
      var avEl = el('av' + i);
      if (avEl) {
        if (ak && p) {
          avEl.textContent = (p * ak).toFixed(1);
          avEl.className = 'akv';
        } else {
          avEl.textContent = '—';
          avEl.className = 'akv e';
        }
      }

      /* Row status stripe */
      var rowEl = el('row' + i);
      if (rowEl) {
        rowEl.classList.remove('complete', 'partial');
        if (d && p) rowEl.classList.add('complete');
        else if (d || p) rowEl.classList.add('partial');
      }

      if (d) { tD += d; hasD = true; if (pct) tC += d * pct / 100; }
      if (p) { tP += p; hasP = true; }
      if (d && p) done++;
    }

    setText('tD',  hasD ? tD : '—');
    setText('tPt', pct ? pct.toFixed(1) + '%' : '—');
    setText('tC',  (hasD && pct) ? tC.toFixed(0) : '—');
    setText('tPr', hasP ? tP : '—');

    var prog = Math.round(done / rc * 100);
    var pfEl = el('pf'); if (pfEl) pfEl.style.width = prog + '%';
    setText('pl', done + ' of ' + rc + ' outlets complete');
    setText('sbadge', done + '/' + rc);
  }

  /* ── ACTIONS ───────────────────────────────────────────────── */
  function clearAll() {
    if (!confirm('Clear all data on this sheet?')) return;
    s('uname', '');
    s('akf', '');
    for (var i = 1; i <= rc; i++) {
      s('d' + i, ''); s('p' + i, ''); s('c' + i, '');
      var pv = el('pv' + i); if (pv) { pv.textContent = '—'; pv.className = 'ppv e'; }
      var av = el('av' + i); if (av) { av.textContent = '—'; av.className = 'akv e'; }
      var r  = el('row' + i); if (r) r.classList.remove('complete', 'partial');
    }
    ['tpct','tD','tPt','tC','tPr'].forEach(function(id) { setText(id, '—'); });
    var pfEl = el('pf'); if (pfEl) pfEl.style.width = '0%';
    setText('pl', '0 of ' + rc + ' outlets complete');
    setText('sbadge', '0/' + rc);
    autoSave();
  }

  function addRow() { rc++; appendRow(rc, null); refreshAll(); autoSave(); }

  function copyCSV() {
    var name = v('uname') || 'Unit';
    var pct  = calcTgtPct();
    var ak   = getAK();
    var csv  = 'Pocket Balancer — ' + name + '\n';
    csv += 'Outlet,Design CFM,Target %,CFM Calc,Prelim CFM,Prelim %' + (ak ? ',True CFM (AK)' : '') + '\n';
    for (var i = 1; i <= rc; i++) {
      var d = v('d' + i), p = v('p' + i), c = v('c' + i);
      var pvEl = el('pv' + i), avEl = el('av' + i);
      var pvt = pvEl ? pvEl.textContent : '';
      var avt = avEl ? avEl.textContent : '';
      if (d || p) {
        csv += 'Outlet-' + String(i).padStart(2, '0') + ',' +
               d + ',' + (pct ? pct.toFixed(1) : '') + ',' + c + ',' + p + ',' + pvt +
               (ak ? ',' + avt : '') + '\n';
      }
    }
    navigator.clipboard.writeText(csv)
      .then(function() {
        var b = document.querySelector('.ab.pri');
        if (b) { b.textContent = '✓ Copied'; setTimeout(function() { b.textContent = 'Copy CSV'; }, 2000); }
      })
      .catch(function() { alert('Copy failed — try again'); });
  }

  /* ── JOBS ──────────────────────────────────────────────────── */
  function openJobs()  { renderJobs(); el('ov').classList.add('open'); }
  function closeJobs() { el('ov').classList.remove('open'); }
  function bgClose(e)  { if (e.target === el('ov')) closeJobs(); }

  function renderJobs() {
    var jobs = getJobs();
    var jl   = el('jlist');
    if (!jl) return;
    var ids = Object.keys(jobs).sort(function(a, b) { return (jobs[b].ts || 0) - (jobs[a].ts || 0); });
    if (!ids.length) {
      jl.innerHTML = '<div class="nojobs">No saved jobs yet.<br>Saves automatically as you type.</div>';
      return;
    }
    jl.innerHTML = ids.map(function(id) {
      var j   = jobs[id];
      var n   = j.name || '(no name)';
      var cnt = (j.outlets || []).filter(function(o) { return o.d || o.p; }).length;
      var dt  = j.ts ? new Date(j.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      return '<div class="jr" onclick="loadJob(\'' + id + '\')">' +
        '<div class="ji"><div class="jn">' + n + '</div><div class="jm">' + cnt + ' outlets &middot; ' + dt + '</div></div>' +
        (id === cid ? '<span class="jab">ACTIVE</span>' : '') +
        '<button class="jdl" onclick="delJob(event,\'' + id + '\')">&#x1F5D1;</button>' +
        '</div>';
    }).join('');
  }

  function loadJob(id) {
    var j = getJobs();
    if (!j[id]) return;
    setSavedId(id);
    restore(j[id]);
    closeJobs();
  }

  function delJob(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this job?')) return;
    var j = getJobs();
    delete j[id];
    putJobs(j);
    if (cid === id) {
      var r = Object.keys(j).sort(function(a, b) { return (j[b].ts || 0) - (j[a].ts || 0); });
      if (r.length) { loadJob(r[0]); } else { cid = null; localStorage.removeItem('pb_cur'); resetSheet(); }
    }
    renderJobs();
  }

  function newJob() { autoSave(); cid = 'j' + Date.now(); setSavedId(cid); resetSheet(); closeJobs(); }

  function resetSheet() {
    rc = DR;
    buildRows(rc);
    s('uname', '');
    s('akf', '');
    refreshAll();
  }

  /* ── INIT ──────────────────────────────────────────────────── */
  function init() {
    buildRows(DR);
    var sid  = getSavedId();
    var jobs = getJobs();
    if (sid && jobs[sid]) { cid = sid; restore(jobs[sid]); return; }
    var ids = Object.keys(jobs).sort(function(a, b) { return (jobs[b].ts || 0) - (jobs[a].ts || 0); });
    if (ids.length) { cid = ids[0]; setSavedId(ids[0]); restore(jobs[ids[0]]); }
  }

  document.addEventListener('DOMContentLoaded', init);

  /* ── SERVICE WORKER ────────────────────────────────────────── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('service-worker.js')
        .catch(function(err) { console.warn('SW registration failed:', err); });
    });
  }
</script>
</body>
</html>
